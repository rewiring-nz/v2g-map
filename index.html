<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2G Trial Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: toolbar over a full-height map canvas on a faint blueprint grid, details panel docked right (stacks below on phones) */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #12202a;
  --muted: #586a76;
  --line: #c9d4db;
  --grid: #dfe6eb;
  --accent: #0a7489;
  --accent-soft: #d5edf1;
  --issue: #c2410c;
  --issue-soft: #fbe6da;
  --learning: #2e7a33;
  --learning-soft: #e0f0df;
  --explainer: #3a57d0;
  --explainer-soft: #e3e8fb;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161b; --surface: #15212a; --ink: #e3ecf0; --muted: #94a6b1; --line: #2c3c47; --grid: #18242c;
    --accent: #4fc4d7; --accent-soft: #143840;
    --issue: #f98a5b; --issue-soft: #3b2217; --learning: #7cc97f; --learning-soft: #1a3220;
    --explainer: #92a8ff; --explainer-soft: #1f2746;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161b; --surface: #15212a; --ink: #e3ecf0; --muted: #94a6b1; --line: #2c3c47; --grid: #18242c;
  --accent: #4fc4d7; --accent-soft: #143840;
  --issue: #f98a5b; --issue-soft: #3b2217; --learning: #7cc97f; --learning-soft: #1a3220;
  --explainer: #92a8ff; --explainer-soft: #1f2746;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.sample {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--issue); background: var(--issue-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.sample.live { color: var(--learning); background: var(--learning-soft); }
.search { flex: 1 1 260px; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.search input::placeholder { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 11px; font-size: 13px; color: var(--muted);
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip .k { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.k.issue-open { background: var(--surface); box-shadow: inset 0 0 0 2.5px var(--issue); }
.k.issue { background: var(--issue); }
.k.learning { background: var(--learning); }
.k.explainer { background: var(--explainer); }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.map {
  position: relative; min-height: 0; overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
}
#svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#svg:active { cursor: grabbing; }

.tools { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
.tools button {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1;
}
.tools button.fit { font-size: 12px; font-weight: 700; }
.legend {
  position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  font-size: 12px; color: var(--muted); max-width: calc(100% - 24px); box-sizing: border-box;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* map marks */
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.cross { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 5 4; pointer-events: none; }
.node { cursor: pointer; outline: none; }
.root-pill { fill: var(--ink); }
.root-lbl { fill: var(--bg); font-family: var(--display); font-weight: 700; font-size: 18px; }
.topic-pill { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.node.topic:hover .topic-pill, .node.topic:focus-visible .topic-pill { stroke: var(--accent); }
.node.topic.selected .topic-pill { stroke: var(--accent); stroke-width: 2.2; }
.topic-lbl { fill: var(--ink); font-family: var(--display); font-weight: 700; font-size: 14px; }
.badge { fill: var(--accent-soft); }
.badge-lbl { fill: var(--accent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dot { stroke-width: 0; }
.t-learning .dot { fill: var(--learning); }
.t-explainer .dot { fill: var(--explainer); }
.t-issue.s-resolved .dot { fill: var(--issue); }
.t-issue.s-open .dot { fill: var(--surface); stroke: var(--issue); stroke-width: 2.5; }
.check { fill: none; stroke: var(--surface); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.item-lbl { fill: var(--ink); font-size: 13px; }
.node.item:hover .item-lbl, .node.item:focus-visible .item-lbl { fill: var(--accent); }
.node.item.selected .item-lbl { font-weight: 700; fill: var(--accent); }
.node.item.selected .halo, .node.item.match .halo { opacity: 1; }
.halo { fill: var(--accent-soft); opacity: 0; }
.node.item.related .item-lbl { fill: var(--accent); }

/* panel */
.panel {
  min-width: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line);
  padding-block: 20px 28px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.panel h2 { font-family: var(--display); font-size: 21px; line-height: 1.25; margin: 4px 0 10px; text-wrap: balance; }
.panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 8px; }
.panel p { margin: 0 0 12px; }
.crumb { font-size: 13px; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.pill.issue { color: var(--issue); background: var(--issue-soft); }
.pill.learning { color: var(--learning); background: var(--learning-soft); }
.pill.explainer { color: var(--explainer); background: var(--explainer-soft); }
.pill.open { color: var(--issue); box-shadow: inset 0 0 0 1.5px var(--issue); }
.pill.resolved { color: var(--learning); box-shadow: inset 0 0 0 1.5px var(--learning); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.tag:hover { border-color: var(--accent); color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button {
  display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-radius: 8px; padding: 7px 8px;
}
.list button:hover { background: var(--bg); }
.list .k { margin-top: 6px; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.list small { display: block; color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.outline-btn {
  margin-top: 22px; width: 100%; padding: 10px; border-radius: 10px; border: 1px dashed var(--line);
  background: var(--bg); color: var(--muted); font-weight: 700; cursor: not-allowed;
}
a.outline-btn { display: block; box-sizing: border-box; text-align: center; text-decoration: none; color: var(--accent); border-style: solid; border-color: var(--accent); cursor: pointer; }
.note { font-size: 13px; color: var(--muted); margin-top: 8px; }
.article { white-space: pre-wrap; overflow-wrap: anywhere; }
.photo { display: block; max-width: 100%; border-radius: 10px; margin-bottom: 12px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }

@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .map { height: 64vh; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .filters .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>V2G Trial Map</h1><span class="sample" id="source">Sample data</span></div>
    <div class="search">
      <label class="sr" for="q">Search issues and learnings</label>
      <input id="q" type="search" autocomplete="off" placeholder="Search, e.g. export limit, warranty, Wi-Fi">
    </div>
    <div class="filters" role="group" aria-label="Show or hide">
      <button class="chip" id="f-issue" data-f="issue" aria-pressed="true"><span class="k issue"></span>Issues</button>
      <button class="chip" id="f-learning" data-f="learning" aria-pressed="true"><span class="k learning"></span>Learnings</button>
      <button class="chip" id="f-explainer" data-f="explainer" aria-pressed="true"><span class="k explainer"></span>Explainers</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="chip" id="f-open" data-f="open" aria-pressed="true">Open</button>
      <button class="chip" id="f-resolved" data-f="resolved" aria-pressed="true">Resolved</button>
    </div>
  </header>
  <main class="main">
    <section class="map" aria-label="Mind map of the V2G trial">
      <svg id="svg"></svg>
      <div class="tools">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">&minus;</button>
        <button id="zfit" class="fit" aria-label="Fit the map to the screen">Fit</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="k issue-open" style="width:10px;height:10px;border-radius:50%;display:inline-block"></i>Open issue</span>
        <span><i class="k issue" style="width:10px;height:10px;border-radius:50%;display:inline-block"></i>Resolved issue</span>
        <span><i class="k learning" style="width:10px;height:10px;border-radius:50%;display:inline-block"></i>Learning</span>
        <span><i class="k explainer" style="width:10px;height:10px;border-radius:50%;display:inline-block"></i>Explainer</span>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
// ---------- SETTINGS ----------
// Paste the Google Sheets "Publish to web" CSV link of the entries tab here.
// Leave it empty to show the sample data below.
const CONFIG = {
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT4zcD9D8YXb0JmIVIrAftPKUtIlrgq0J-vZCbMm35g5RTdaM2Udx48cUgvwKhdn8rb7ng0-0YpmIy7/pub?output=csv",
  refreshMinutes: 5,
  centreLabel: "Knowledge base",
};

// SAMPLE DATA, shown until CONFIG.sheetCsvUrl is set and loads.
const SAMPLE_TOPICS = [
  { id: "veh", name: "Vehicles and compatibility", items: [
    { id: "veh1", type: "explainer", title: "Which EVs can send power back", summary: "Only some vehicles support bidirectional charging, and support depends on the charging plug and the car's software as well as the model.", tags: ["CHAdeMO", "CCS", "compatibility"], links: ["veh2", "hw1"] },
    { id: "veh2", type: "learning", title: "CHAdeMO cars were the easiest place to start", summary: "Cars with CHAdeMO plugs worked with the widest range of bidirectional chargers during the trial. CCS support was still limited.", tags: ["CHAdeMO", "Nissan Leaf", "compatibility"], links: ["hw2"] },
    { id: "veh3", type: "issue", status: "resolved", title: "Car software update stopped exports", summary: "After a vehicle software update, one car stopped accepting discharge commands. A charger firmware update restored it.", tags: ["firmware", "Nissan Leaf"], links: ["sw2"] },
    { id: "veh4", type: "issue", status: "open", title: "Battery warranty wording unclear for V2G use", summary: "Warranty documents don't say clearly whether exporting power affects battery cover. Households asked about this before signing up.", tags: ["warranty", "battery health"], links: ["hh2"] },
  ]},
  { id: "hw", name: "Chargers and hardware", items: [
    { id: "hw1", type: "explainer", title: "What a bidirectional charger does", summary: "A bidirectional charger can move power from the grid into the car and from the car back into the home or the grid.", tags: ["charger", "basics"], links: ["std1"] },
    { id: "hw2", type: "issue", status: "open", title: "Long wait times for bidirectional chargers", summary: "Some charger orders took more than three months to arrive, which pushed back installs.", tags: ["supply", "charger"], links: ["net3"] },
    { id: "hw3", type: "issue", status: "resolved", title: "Charger dropped offline on weak Wi-Fi", summary: "Chargers in garages far from the router lost connection and missed scheduled exports. A wired connection fixed it.", tags: ["Wi-Fi", "connectivity"], links: ["hw4", "sw1"] },
    { id: "hw4", type: "learning", title: "Wired internet made chargers far more reliable", summary: "Homes with an ethernet cable or a mesh Wi-Fi point near the charger had almost no missed schedules.", tags: ["connectivity", "install tip"], links: ["ins2"] },
  ]},
  { id: "ins", name: "Installation and electrical", items: [
    { id: "ins1", type: "issue", status: "resolved", title: "Older homes needed a switchboard upgrade", summary: "Several older homes needed switchboard work before the charger could be connected, which added cost and time.", tags: ["switchboard", "cost"], links: ["ins2", "ins3"] },
    { id: "ins2", type: "learning", title: "A site survey before quoting avoided surprise costs", summary: "Visiting the home before quoting caught switchboard, cable and internet issues early.", tags: ["install tip", "cost"], links: [] },
    { id: "ins3", type: "issue", status: "open", title: "Long cable runs to detached garages", summary: "Detached garages needed long cable runs, which raised install cost the most of any single factor.", tags: ["cost", "cabling"], links: [] },
    { id: "ins4", type: "explainer", title: "Why a V2G charger counts as an inverter", summary: "Because it can export power, a bidirectional charger is treated like a solar or battery inverter for connection and safety rules.", tags: ["inverter", "rules"], links: ["std1", "net2"] },
  ]},
  { id: "net", name: "Network and export limits", items: [
    { id: "net1", type: "issue", status: "open", title: "Network approval took several weeks", summary: "Approval to connect from the local lines company took several weeks for some homes.", tags: ["lines company", "approval"], links: ["net3"] },
    { id: "net2", type: "explainer", title: "Export limits explained", summary: "Lines companies may cap how much power a home can send back to the network at once. The cap can be lower than the charger's capacity.", tags: ["export limit", "basics"], links: ["net4"] },
    { id: "net3", type: "learning", title: "Apply for network approval when you order hardware", summary: "Starting the approval while waiting for the charger removed most of the delay.", tags: ["approval", "install tip"], links: [] },
    { id: "net4", type: "issue", status: "open", title: "Export capped below charger capacity", summary: "Some homes were limited to exporting less than the charger could deliver, reducing the value of exports.", tags: ["export limit", "savings"], links: ["tar2"] },
  ]},
  { id: "sw", name: "Software and control", items: [
    { id: "sw1", type: "explainer", title: "How scheduling and dispatch work", summary: "The charger follows a schedule or signals from a controller to decide when to charge the car and when to export.", tags: ["schedule", "basics"], links: ["sw2", "tar1"] },
    { id: "sw2", type: "issue", status: "resolved", title: "Schedules ignored after daylight saving change", summary: "Chargers ran an hour off schedule after the clocks changed until a software fix was rolled out.", tags: ["schedule", "firmware"], links: [] },
    { id: "sw3", type: "learning", title: "A minimum battery reserve setting is essential", summary: "Letting households set a minimum charge level the car never drops below was the single biggest confidence builder.", tags: ["battery reserve", "household"], links: ["hh1", "hh2"] },
    { id: "sw4", type: "issue", status: "open", title: "App and charger showed different battery levels", summary: "The car's app and the charger's app sometimes showed different charge levels, which confused households.", tags: ["app", "data"], links: ["tar4"] },
  ]},
  { id: "tar", name: "Tariffs and savings", items: [
    { id: "tar1", type: "explainer", title: "Time-of-use pricing and V2G", summary: "With time-of-use pricing, the car charges when power is cheap and supplies the home when it's expensive.", tags: ["tariff", "basics"], links: ["tar2"] },
    { id: "tar2", type: "learning", title: "Savings depended mostly on the tariff", summary: "Households on the right time-of-use plan saved far more than those on flat pricing with the same hardware.", tags: ["tariff", "savings"], links: ["hh3"] },
    { id: "tar3", type: "issue", status: "open", title: "Buy-back rates too low to make export worthwhile", summary: "Some retailers paid little for exported power, so supplying the home was worth more than exporting to the grid.", tags: ["retailer", "export", "savings"], links: ["net4"] },
    { id: "tar4", type: "issue", status: "open", title: "Bills hard to match against charger data", summary: "Households couldn't easily check their power bill against what the charger reported.", tags: ["billing", "data"], links: [] },
  ]},
  { id: "std", name: "Standards and approvals", items: [
    { id: "std1", type: "explainer", title: "Rules that apply to bidirectional chargers", summary: "Which connection and safety standards apply, and who signs off each install.", tags: ["rules", "inverter", "compliance"], links: ["std2"] },
    { id: "std2", type: "issue", status: "resolved", title: "Charger model missing from the approved list", summary: "One charger model wasn't on the approved equipment list at first, which held up approval until it was added.", tags: ["compliance", "approval"], links: ["net1"] },
    { id: "std3", type: "learning", title: "Keep compliance certificates with each install record", summary: "Storing certificates with each home's record saved time when lines companies or auditors asked for them.", tags: ["compliance", "records"], links: [] },
  ]},
  { id: "hh", name: "Household experience", items: [
    { id: "hh1", type: "issue", status: "resolved", title: "Car not charged enough for an unexpected trip", summary: "A household needed the car unexpectedly while it was low after exporting. A battery reserve and an override button fixed it.", tags: ["battery reserve", "household"], links: ["hh2"] },
    { id: "hh2", type: "learning", title: "Households wanted one simple override button", summary: "A single 'charge now' button mattered more to households than detailed scheduling controls.", tags: ["household", "app"], links: [] },
    { id: "hh3", type: "learning", title: "Showing dollars earned kept people engaged", summary: "Households checked the app more and stayed in the trial when it showed savings in dollars rather than kWh.", tags: ["household", "savings", "app"], links: [] },
    { id: "hh4", type: "issue", status: "open", title: "Charger fan noise at night", summary: "Charger fans were noticeable at night in garages next to bedrooms.", tags: ["noise", "household"], links: ["ins3"] },
  ]},
];

let TOPICS = [], ITEMS = new Map(), TOPIC_BY_ID = new Map();
function ingest(topics) {
  TOPICS = topics;
  ITEMS = new Map();
  TOPICS.forEach(t => t.items.forEach(it => { it.topic = t; ITEMS.set(it.id, it); }));
  ITEMS.forEach(it => it.links.forEach(id => { const o = ITEMS.get(id); if (o && !o.links.includes(it.id)) o.links.push(it.id); }));
  TOPIC_BY_ID = new Map(TOPICS.map(t => [t.id, t]));
  if (state.selected && !ITEMS.has(state.selected) && !TOPIC_BY_ID.has(state.selected)) state.selected = null;
}

// ---------- reading the Google Sheet ----------
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

// Column headers are matched by name, in any order and any case; extra columns are ignored.
// Each field takes the first header that equals one of its `is` names, else one containing a `has` word.
const COLUMNS = {
  id: { is: ["id"] },
  title: { is: ["title", "name", "headline"] },
  topic: { is: ["top tag", "topic", "category", "branch"], has: ["topic", "category"] },
  type: { is: ["type", "type of entry"], has: ["type"] },
  status: { is: ["status"] },
  summary: { is: ["summary", "description", "details"], has: ["description", "summary"] },
  article: { is: ["article", "body"], has: ["article"] },
  tags: { is: ["tags", "keywords"] },
  related: { is: ["related", "related items", "links"] },
  link: { is: ["link", "url", "outline link"] },
  contributors: { is: ["contributors", "contributor", "added by", "author"], has: ["contributor"] },
  image: { is: ["image", "photo"], has: ["image"] },
};
// Words in the Type column that map to each kind of entry.
const TYPE_WORDS = { issue: ["issue", "problem"], learning: ["learning", "lesson", "insight", "finding"], explainer: ["explainer", "educational", "education", "background"] };
const splitList = s => s.split(/[,;]/).map(x => x.trim()).filter(Boolean);

function rowsToTopics(rows) {
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  const col = {}, used = new Set();
  for (const k in COLUMNS) {
    const { is = [], has = [] } = COLUMNS[k];
    let i = head.findIndex((h, j) => !used.has(j) && is.includes(h));
    if (i < 0) i = head.findIndex((h, j) => !used.has(j) && has.some(w => h.includes(w)));
    col[k] = i;
    if (i >= 0) used.add(i);
  }
  if (col.title < 0) throw new Error('The sheet needs a "Title" column');
  const get = (r, k) => col[k] >= 0 ? (r[col[k]] || "").trim() : "";
  const topics = new Map(), items = [], seen = new Set();
  rows.forEach((r, i) => {
    const title = get(r, "title");
    if (!title) return;
    const topicName = get(r, "topic") || "Uncategorised";
    if (!topics.has(topicName)) topics.set(topicName, { id: "topic-" + topics.size, name: topicName, items: [] });
    const rawType = get(r, "type").toLowerCase();
    const type = Object.keys(TYPE_WORDS).find(k => TYPE_WORDS[k].some(w => rawType.includes(w))) || "learning";
    const status = type === "issue" ? (get(r, "status").toLowerCase() === "resolved" ? "resolved" : "open") : undefined;
    let id = get(r, "id") || "row" + (i + 2);
    if (seen.has(id.toLowerCase())) id += "-" + (i + 2);
    seen.add(id.toLowerCase());
    const it = { id, title, type, status, summary: get(r, "summary"), tags: splitList(get(r, "tags")), rawRelated: splitList(get(r, "related")), link: get(r, "link"),
      article: get(r, "article"), contributors: get(r, "contributors"), image: get(r, "image"), links: [] };
    topics.get(topicName).items.push(it); items.push(it);
  });
  const byKey = new Map();
  items.forEach(it => { byKey.set(it.title.toLowerCase(), it.id); byKey.set(it.id.toLowerCase(), it.id); });
  items.forEach(it => { it.links = [...new Set(it.rawRelated.map(s => byKey.get(s.toLowerCase())).filter(id => id && id !== it.id))]; });
  return [...topics.values()];
}

let live = false;
async function loadSheet() {
  if (!CONFIG.sheetCsvUrl) return;
  const src = document.getElementById("source");
  try {
    const url = CONFIG.sheetCsvUrl + (CONFIG.sheetCsvUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("The sheet link answered " + res.status);
    const topics = rowsToTopics(parseCSV(await res.text()));
    if (!topics.length) throw new Error("The sheet has no rows with a title");
    const first = !live;
    live = true;
    ingest(topics);
    render();
    if (first && !userMoved) fit(false);
    src.textContent = "Live · updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    src.className = "sample live";
    src.title = "";
  } catch (err) {
    console.warn("Could not load the sheet:", err);
    src.textContent = live ? "Live · update failed, retrying" : "Sample data · sheet not loading";
    src.title = String(err && err.message || err);
  }
}

const TYPE_NAME = { issue: "Issue", learning: "Learning", explainer: "Explainer" };
const state = { q: "", selected: null, collapsed: new Set(), filters: { issue: true, learning: true, explainer: true, open: true, resolved: true } };
const DUR = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 350;
const ROW = 30, TOPIC_GAP = 150, LEAF_GAP = 42, LABEL_MAX = 46;
const ROOT_LABEL = CONFIG.centreLabel;
const ROOT_FONT = '700 18px "Bricolage Grotesque", system-ui, sans-serif';
const TOPIC_FONT = '700 14px "Bricolage Grotesque", system-ui, sans-serif';
const ITEM_FONT = '400 13px "Atkinson Hyperlegible", system-ui, sans-serif';

const ctx = document.createElement("canvas").getContext("2d");
const textW = (s, font) => { ctx.font = font; return ctx.measureText(s).width; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = s => s.length > LABEL_MAX ? s.slice(0, LABEL_MAX - 1).trimEnd() + "…" : s;
const passes = it => state.filters[it.type] && (it.type !== "issue" || state.filters[it.status]);
const keyClass = it => it.type === "issue" ? (it.status === "open" ? "issue-open" : "issue") : it.type;

function matchSet() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const m = new Set();
  ITEMS.forEach(it => {
    const hay = [it.title, it.summary, it.article || "", it.contributors || "", it.tags.join(" "), it.topic.name, TYPE_NAME[it.type], it.status || ""].join(" ").toLowerCase();
    if (passes(it) && words.every(w => hay.includes(w))) m.add(it.id);
  });
  return m;
}

const hPath = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };

function computeLayout() {
  const matches = matchSet();
  const nodes = [], edges = [], pos = new Map();
  const rootW = textW(ROOT_LABEL, ROOT_FONT) + 40;
  const bounds = { x0: -rootW / 2, x1: rootW / 2, y0: -24, y1: 24 };
  const grow = (x, y) => { bounds.x0 = Math.min(bounds.x0, x); bounds.x1 = Math.max(bounds.x1, x); bounds.y0 = Math.min(bounds.y0, y - 18); bounds.y1 = Math.max(bounds.y1, y + 18); };
  nodes.push({ id: "root", kind: "root", x: 0, y: 0, sx: 0, sy: 0, w: rootW, label: ROOT_LABEL });

  const half = Math.ceil(TOPICS.length / 2);
  [[TOPICS.slice(0, half), 1], [TOPICS.slice(half), -1]].forEach(([topics, sign]) => {
    const data = { children: topics.map(t => {
      const items = t.items.filter(passes);
      const forced = matches && items.some(i => matches.has(i.id));
      const open = forced || !state.collapsed.has(t.id);
      return { topic: t, items, open, children: open && items.length ? items.map(it => ({ item: it })) : undefined };
    }) };
    const h = d3.hierarchy(data);
    d3.tree().nodeSize([ROW, 1]).separation((a, b) => a.parent === b.parent ? (a.depth === 1 ? 1.35 : 1) : 1.6)(h);
    (h.children || []).forEach(tn => {
      const { topic: t, items, open } = tn.data;
      const y = tn.x;
      const w = 14 + textW(t.name, TOPIC_FONT) + 10 + 28 + 6;
      const xInner = sign * TOPIC_GAP;
      const xLeft = sign > 0 ? xInner : xInner - w;
      const xOuter = sign > 0 ? xInner + w : xInner - w;
      const dim = matches ? !items.some(i => matches.has(i.id)) : false;
      nodes.push({ id: t.id, kind: "topic", x: xLeft, y, sx: xLeft, sy: y, w, sign, label: t.name, count: items.length, open, dim, topic: t });
      edges.push({ id: "e-" + t.id, d: hPath(sign * rootW / 2, 0, xInner, y), dim });
      grow(xLeft, y); grow(xLeft + w, y);
      (tn.children || []).forEach(ln => {
        const it = ln.data.item;
        const x = xOuter + sign * LEAF_GAP, ly = ln.x;
        const label = short(it.title);
        const n = { id: it.id, kind: "item", x, y: ly, sx: xOuter, sy: y, sign, label, item: it, dim: matches ? !matches.has(it.id) : false, match: matches ? matches.has(it.id) : false };
        nodes.push(n); pos.set(it.id, n);
        edges.push({ id: "e-" + it.id, d: hPath(xOuter, y, x - sign * 7, ly), start: hPath(xOuter, y, xOuter, y), dim: n.dim });
        grow(x, ly); grow(x + sign * (14 + textW(label, ITEM_FONT)), ly);
      });
    });
  });
  return { nodes, edges, pos, bounds, matches };
}

// ---------- SVG scaffold ----------
const svg = d3.select("#svg");
const gRoot = svg.append("g");
const gEdges = gRoot.append("g");
const gCross = gRoot.append("g");
const gNodes = gRoot.append("g");
const zoom = d3.zoom().scaleExtent([0.25, 2.5]).on("zoom", e => gRoot.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
let layout = null;

function build(g, d) {
  if (d.kind === "root") {
    g.append("rect").attr("class", "root-pill");
    g.append("text").attr("class", "root-lbl").attr("text-anchor", "middle").attr("dy", "0.35em");
  } else if (d.kind === "topic") {
    g.append("title");
    g.append("rect").attr("class", "topic-pill");
    g.append("text").attr("class", "topic-lbl").attr("dy", "0.35em");
    g.append("rect").attr("class", "badge");
    g.append("text").attr("class", "badge-lbl").attr("text-anchor", "middle").attr("dy", "0.35em");
  } else {
    g.append("title");
    g.append("circle").attr("class", "halo").attr("r", 11);
    g.append("circle").attr("class", "dot").attr("r", 6);
    g.append("path").attr("class", "check").attr("d", "M-3,0.2L-1,2.3L3,-2.2");
    g.append("text").attr("class", "item-lbl").attr("dy", "0.35em");
  }
}

function refresh(g, d) {
  if (d.kind === "root") {
    g.select("rect").attr("x", -d.w / 2).attr("y", -22).attr("width", d.w).attr("height", 44).attr("rx", 22);
    g.select("text").text(d.label);
  } else if (d.kind === "topic") {
    g.select("title").text(`${d.label}: ${d.count} items. Click to ${d.open ? "close" : "open"}.`);
    g.select(".topic-pill").attr("x", 0).attr("y", -14).attr("width", d.w).attr("height", 28).attr("rx", 14);
    g.select(".topic-lbl").attr("x", 14).text(d.label);
    g.select(".badge").attr("x", d.w - 34).attr("y", -10).attr("width", 28).attr("height", 20).attr("rx", 10);
    g.select(".badge-lbl").attr("x", d.w - 20).text(d.open ? d.count : "+" + d.count);
  } else {
    const it = d.item;
    g.select("title").text(it.title);
    g.select(".check").attr("display", it.type === "issue" && it.status === "resolved" ? null : "none");
    g.select(".item-lbl").attr("x", d.sign * 13).attr("text-anchor", d.sign > 0 ? "start" : "end").text(d.label);
  }
}

function classes(d) {
  const sel = state.selected;
  if (d.kind === "root") return "node root";
  if (d.kind === "topic") return "node topic" + (sel === d.id ? " selected" : "");
  const it = d.item, s = sel && ITEMS.get(sel);
  return "node item t-" + it.type + (it.status ? " s-" + it.status : "") + (d.match ? " match" : "") +
    (sel === it.id ? " selected" : "") + (s && s.links.includes(it.id) ? " related" : "");
}

function ariaLabel(d) {
  if (d.kind === "root") return ROOT_LABEL + ". Open or close all topics.";
  if (d.kind === "topic") return `${d.label}, ${d.count} items, ${d.open ? "open" : "closed"}`;
  const it = d.item;
  return `${TYPE_NAME[it.type]}${it.status ? ", " + it.status : ""}: ${it.title}`;
}

function render() {
  layout = computeLayout();
  const t = svg.transition().duration(DUR);

  gEdges.selectAll("path.edge").data(layout.edges, d => d.id).join(
    enter => enter.append("path").attr("class", "edge").attr("d", d => d.start || d.d).attr("opacity", 0),
    update => update,
    exit => exit.transition(t).attr("opacity", 0).remove()
  ).transition(t).attr("d", d => d.d).attr("opacity", d => d.dim ? 0.3 : 1);

  const sel = gNodes.selectAll("g.node").data(layout.nodes, d => d.id).join(
    enter => {
      const g = enter.append("g").attr("tabindex", 0).attr("role", "button")
        .attr("transform", d => `translate(${d.sx},${d.sy})`).attr("opacity", 0)
        .on("click", (e, d) => onNode(d))
        .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onNode(d); } });
      g.each(function (d) { build(d3.select(this), d); });
      return g;
    },
    update => update,
    exit => exit.transition(t).attr("opacity", 0).remove()
  );
  sel.each(function (d) { refresh(d3.select(this), d); });
  sel.attr("class", classes).attr("aria-label", ariaLabel);
  sel.transition(t).attr("transform", d => `translate(${d.x},${d.y})`).attr("opacity", d => d.dim ? 0.25 : 1);

  const cross = [];
  const s = state.selected && ITEMS.get(state.selected);
  if (s) {
    const a = layout.pos.get(s.id);
    if (a) s.links.forEach(id => { const b = layout.pos.get(id); if (b) cross.push({ id: s.id + ">" + id, a, b }); });
  }
  gCross.selectAll("path.cross").data(cross, d => d.id).join(
    enter => enter.append("path").attr("class", "cross").attr("opacity", 0),
    update => update,
    exit => exit.remove()
  ).attr("d", d => `M${d.a.x},${d.a.y}C${d.a.x - d.a.sign * 110},${d.a.y} ${d.b.x - d.b.sign * 110},${d.b.y} ${d.b.x},${d.b.y}`)
    .transition().delay(DUR).duration(DUR ? 200 : 0).attr("opacity", 1);

  renderPanel();
}

function fit(animate = true) {
  const b = layout.bounds;
  const { width: W, height: H } = svg.node().getBoundingClientRect();
  if (!W || !H) return;
  const k = Math.min(1.3, 0.9 * Math.min(W / (b.x1 - b.x0), H / (b.y1 - b.y0)));
  const tr = d3.zoomIdentity.translate(W / 2 - k * (b.x0 + b.x1) / 2, H / 2 - k * (b.y0 + b.y1) / 2).scale(k);
  (animate && DUR ? svg.transition().duration(DUR) : svg).call(zoom.transform, tr);
}

function panTo(id) {
  const n = layout.pos.get(id);
  if (!n) return;
  const k = d3.zoomTransform(svg.node()).k;
  const cx = n.x + n.sign * Math.min(160, 80 / k);
  (DUR ? svg.transition().duration(DUR) : svg).call(zoom.translateTo, cx, n.y);
}

// ---------- interaction ----------
function onNode(d) {
  if (d.kind === "root") {
    const anyOpen = TOPICS.some(t => !state.collapsed.has(t.id));
    TOPICS.forEach(t => anyOpen ? state.collapsed.add(t.id) : state.collapsed.delete(t.id));
    state.selected = null;
    render();
    setTimeout(() => fit(), DUR);
  } else if (d.kind === "topic") {
    if (state.collapsed.has(d.id)) state.collapsed.delete(d.id); else state.collapsed.add(d.id);
    state.selected = d.id;
    render();
  } else {
    selectItem(d.item.id);
  }
}

function selectItem(id) {
  const it = ITEMS.get(id);
  if (!it) return;
  state.selected = id;
  state.collapsed.delete(it.topic.id);
  if (!passes(it)) { state.filters[it.type] = true; if (it.status) state.filters[it.status] = true; syncChips(); }
  render();
  panTo(id);
  if (matchMedia("(max-width: 760px)").matches) document.getElementById("panel").scrollIntoView({ behavior: DUR ? "smooth" : "auto", block: "start" });
}

function itemRow(it, sub) {
  return `<li><button data-select="${it.id}"><span class="k ${keyClass(it)}"></span><span>${esc(it.title)}<small>${esc(sub)}</small></span></button></li>`;
}
const subLine = it => TYPE_NAME[it.type] + (it.status ? " · " + it.status[0].toUpperCase() + it.status.slice(1) : "");

function renderPanel() {
  const p = document.getElementById("panel");
  const sel = state.selected;
  const it = sel && ITEMS.get(sel);
  const topic = sel && TOPIC_BY_ID.get(sel);
  const matches = layout.matches;
  const backLink = matches ? `<button class="linkish" data-back>&larr; Back to ${matches.size} search result${matches.size === 1 ? "" : "s"}</button>` : "";

  if (it) {
    const related = it.links.map(id => ITEMS.get(id)).filter(Boolean);
    p.innerHTML = `${backLink}
      <p class="crumb">${esc(ROOT_LABEL)} &rsaquo; ${esc(it.topic.name)}</p>
      <h2>${esc(it.title)}</h2>
      <div class="pills"><span class="pill ${it.type}">${TYPE_NAME[it.type]}</span>${it.status ? `<span class="pill ${it.status}">${it.status === "open" ? "Open" : "Resolved"}</span>` : ""}</div>
      ${/^https?:\/\//.test(it.image || "") ? `<img class="photo" src="${esc(it.image)}" alt="">` : ""}
      ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
      ${it.article ? `<h3>Article</h3><div class="article">${esc(it.article)}</div>` : ""}
      ${it.contributors ? `<p class="crumb">Added by ${esc(it.contributors)}</p>` : ""}
      ${it.tags.length ? `<h3>Tags</h3>
      <div class="tags">${it.tags.map(t => `<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      ${related.length ? `<h3>Related</h3><ul class="list">${related.map(r => itemRow(r, subLine(r) + " · " + r.topic.name)).join("")}</ul>` : ""}
      ${it.link ? `<a class="outline-btn" href="${esc(it.link)}" target="_blank" rel="noopener">Open full article</a>`
        : `<button class="outline-btn" disabled>Open full article</button><p class="note">Add a Link column to the sheet to connect articles.</p>`}`;
  } else if (topic) {
    const items = topic.items.filter(passes);
    p.innerHTML = `${backLink}
      <p class="crumb">${esc(ROOT_LABEL)}</p>
      <h2>${esc(topic.name)}</h2>
      <p>${items.length} item${items.length === 1 ? "" : "s"} shown. Click the topic on the map again to ${state.collapsed.has(topic.id) ? "open" : "close"} it.</p>
      <ul class="list">${items.map(i => itemRow(i, subLine(i))).join("")}</ul>`;
  } else if (matches) {
    const list = [...matches].map(id => ITEMS.get(id));
    p.innerHTML = `<p class="crumb">Search</p>
      <h2>${list.length} result${list.length === 1 ? "" : "s"} for “${esc(state.q.trim())}”</h2>
      ${list.length ? `<ul class="list">${list.map(i => itemRow(i, subLine(i) + " · " + i.topic.name)).join("")}</ul>`
        : `<p>Nothing matches. Try a shorter word, or check the filters above.</p>`}`;
  } else {
    const all = [...ITEMS.values()];
    const n = f => all.filter(f).length;
    p.innerHTML = `<p class="crumb">${live ? "Live" : "Sample data"}</p>
      <h2>What the V2G trial has taught us</h2>
      ${live ? `<p>Built from the team's spreadsheet. It refreshes every ${CONFIG.refreshMinutes} minutes, so new rows appear on their own.</p>`
        : `<p>This map is showing <b>sample issues</b>. Once the team's spreadsheet is connected, it shows the real trial findings and refreshes every ${CONFIG.refreshMinutes} minutes.</p>`}
      <div class="stats">
        <div class="stat"><b>${n(i => i.status === "open")}</b><span>Open issues</span></div>
        <div class="stat"><b>${n(i => i.status === "resolved")}</b><span>Resolved issues</span></div>
        <div class="stat"><b>${n(i => i.type === "learning")}</b><span>Learnings</span></div>
        <div class="stat"><b>${n(i => i.type === "explainer")}</b><span>Explainers</span></div>
      </div>
      <h3>How to use it</h3>
      <ul class="howto">
        <li>Click an item to see its details and the items linked to it.</li>
        <li>Click a topic to open or close it. Click the centre to open or close everything.</li>
        <li>Type in the search box to highlight matching items.</li>
        <li>Drag to move around, scroll or pinch to zoom.</li>
      </ul>`;
  }
}

document.getElementById("panel").addEventListener("click", e => {
  const s = e.target.closest("[data-select]");
  if (s) return selectItem(s.dataset.select);
  const tag = e.target.closest("[data-tag]");
  if (tag) { setQuery(tag.dataset.tag); return; }
  if (e.target.closest("[data-back]")) { state.selected = null; render(); }
});

const q = document.getElementById("q");
function setQuery(v) { q.value = v; state.q = v; state.selected = null; render(); }
q.addEventListener("input", () => { state.q = q.value; state.selected = null; render(); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && layout.matches && layout.matches.size) selectItem([...layout.matches][0]);
  if (e.key === "Escape") setQuery("");
});

function syncChips() {
  document.querySelectorAll(".chip[data-f]").forEach(b => b.setAttribute("aria-pressed", String(state.filters[b.dataset.f])));
}
document.querySelectorAll(".chip[data-f]").forEach(b => b.addEventListener("click", () => {
  const f = b.dataset.f;
  state.filters[f] = !state.filters[f];
  syncChips();
  const it = state.selected && ITEMS.get(state.selected);
  if (it && !passes(it)) state.selected = null;
  render();
}));

document.getElementById("zin").addEventListener("click", () => svg.transition().duration(DUR).call(zoom.scaleBy, 1.3));
document.getElementById("zout").addEventListener("click", () => svg.transition().duration(DUR).call(zoom.scaleBy, 1 / 1.3));
document.getElementById("zfit").addEventListener("click", () => fit());
svg.on("click", e => { if (e.target === svg.node() && state.selected) { state.selected = null; render(); } });

// Refit whenever the map box changes size, until the viewer pans or zooms it themselves
let userMoved = false;
zoom.on("start.user", e => { if (e.sourceEvent) userMoved = true; });
new ResizeObserver(() => { if (!userMoved && layout) fit(false); }).observe(document.querySelector(".map"));

ingest(SAMPLE_TOPICS);
render();
fit(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); if (!userMoved) fit(false); });
loadSheet();
if (CONFIG.sheetCsvUrl) {
  setInterval(loadSheet, CONFIG.refreshMinutes * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSheet(); });
}
</script>
